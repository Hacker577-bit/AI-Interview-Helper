{% extends "base.html" %}

{% block title %}Settings - AI Interview Prep{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h2 class="mb-4">Settings</h2>
            
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <h5 class="card-title mb-3">Profile Information</h5>
                    <form>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" value="{{ current_user.email }}" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="name" class="form-label">Target Role</label>
                            <input type="text" class="form-control" id="name" placeholder="e.g., Senior Software Engineer">
                        </div>
                        <button class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h5 class="card-title mb-3">Account</h5>
                    <p class="text-muted">Plan: <span class="badge bg-success">FREE</span></p>
                    <a href="#" class="btn btn-outline-primary">Upgrade to Pro</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
