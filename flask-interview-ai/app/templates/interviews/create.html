{% extends "base.html" %}

{% block title %}New Interview - AI Interview Prep{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-mic text-primary" style="font-size: 3rem;"></i>
                        <h2 class="mt-3">Start New Interview</h2>
                        <p class="text-muted">Configure your interview session</p>
                    </div>

                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="interview_type" class="form-label">Interview Type</label>
                                <select class="form-select" id="interview_type" name="interview_type" required>
                                    <option value="MIXED">Mixed (Behavioral + Technical)</option>
                                    <option value="BEHAVIORAL">Behavioral Only</option>
                                    <option value="TECHNICAL">Technical Only</option>
                                    <option value="CASE_STUDY">Case Study</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="difficulty" class="form-label">Difficulty Level</label>
                                <select class="form-select" id="difficulty" name="difficulty" required>
                                    <option value="ENTRY">Entry Level</option>
                                    <option value="MID" selected>Mid Level</option>
                                    <option value="SENIOR">Senior Level</option>
                                    <option value="STAFF">Staff/Principal</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="question_count" class="form-label">Number of Questions</label>
                                <select class="form-select" id="question_count" name="question_count" required>
                                    <option value="5">5 Questions (Quick - ~15 min)</option>
                                    <option value="10" selected>10 Questions (Standard - ~30 min)</option>
                                    <option value="15">15 Questions (Comprehensive - ~45 min)</option>
                                    <option value="20">20 Questions (Full - ~60 min)</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="mode" class="form-label">Interview Mode</label>
                                <select class="form-select" id="mode" name="mode" required>
                                    <option value="TEXT" selected>Text Mode</option>
                                    <option value="VOICE">Voice Mode</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="job_description" class="form-label">Job Description (Optional)</label>
                            <textarea class="form-control" id="job_description" name="job_description" rows="4" placeholder="Paste a job description here to get tailored questions..."></textarea>
                            <div class="form-text">AI will generate questions specific to this role</div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-3">
                            <i class="bi bi-play-circle me-2"></i>Start Interview
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
